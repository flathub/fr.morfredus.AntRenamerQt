app-id: fr.morfredus.AntRenamerQt
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: antrenamer-qt
rename-icon: antrenamer-qt
rename-desktop-file: antrenamer-qt.desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
    # A renamer must create files next to the files it is given (the new names, the sidecars, the undo). The document portal
  # gives a file dropped or picked alone a private folder where no sibling can be created, so renaming fails there.
  - --filesystem=home
modules:
  - name: antrenamer-qt
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/morfredus/ant-renamer-qt.git
        tag: v3.3.0
        commit: 42f828403bfcaeeb231b04a6bdc62a5712f4e2fe